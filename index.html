<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>megaZINE has moved</title>
<meta name="robots" content="noindex">
<link rel="canonical" href="https://megazine.org/">
<script>
  // Keep the path after /megazine/, the query (?go=…, ?copy=…) and the hash.
  (function () {
    var rest = location.pathname.replace(/^\/megazine\/?/i, "");
    location.replace("https://megazine.org/" + rest + location.search + location.hash);
  })();
</script>
<meta http-equiv="refresh" content="0; url=https://megazine.org/">
</head>
<body>
<p>megaZINE has moved to <a href="https://megazine.org/">megazine.org</a>.</p>
</body>
</html>
